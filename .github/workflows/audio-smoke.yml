name: Verify ClearCast audio engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bun run lint
      - name: Build production UI
        run: bun run build
      - name: Launch processor
        run: |
          NODE_ENV=production bun run start > /tmp/clearcast-server.log 2>&1 &
      - name: Verify upload through cleaned export
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-clean.mjs
      - name: Print processor logs if failed
        if: failure()
        run: cat /tmp/clearcast-server.log
